name: Verify CV on desktop, mobile and A4 PDF
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "cv-ats.html"
      - "en/index.html"
      - "scripts/build-site.sh"
      - "scripts/audit-bilingual.py"
      - "scripts/audit-language.py"
      - "assets/js/cv-language.js"
      - ".github/workflows/pages.yml"
      - "scripts/check-cv.mjs"
      - "scripts/audit-layout.py"
      - ".github/workflows/cv-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CV repository
        uses: actions/checkout@v4
      - name: Validate SEO, links, privacy and ATS
        run: node scripts/check-cv.mjs
      - name: Render desktop, mobile and print layouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-output
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER" || { echo "Chrome browser is missing"; exit 1; }
          URL="file://$PWD/index.html"
          ATS="file://$PWD/cv-ats.html"
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --screenshot="$PWD/qa-output/desktop.png" "$URL" >/dev/null 2>&1
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=412,915 --screenshot="$PWD/qa-output/mobile.png" "$URL" >/dev/null 2>&1
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --print-to-pdf="$PWD/qa-output/professional-cv.pdf" "$URL" >/dev/null 2>&1
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --print-to-pdf="$PWD/qa-output/ats-cv.pdf" "$ATS" >/dev/null 2>&1
          test -s qa-output/desktop.png
          test -s qa-output/mobile.png
          test -s qa-output/professional-cv.pdf
          test -s qa-output/ats-cv.pdf
          python3 -c 'import re, pathlib; p=pathlib.Path("qa-output"); counts={f:len(re.findall(rb"/Type\s*/Page\b",(p/f).read_bytes())) for f in ["professional-cv.pdf","ats-cv.pdf"]}; print("Verified PDF page counts:",counts); assert counts["professional-cv.pdf"]==2, "Professional PDF must be exactly 2 pages"; assert counts["ats-cv.pdf"]==1, "ATS PDF must fit a single A4 page"'
      - name: Generate and validate all three downloadable PDFs
        run: |
          bash scripts/build-site.sh
          cp _site/*.pdf qa-output/
      - name: Install browser layout test
        run: python3 -m pip install --quiet playwright
      - name: Audit menu overlay and every section at 6 widths
        run: python3 scripts/audit-layout.py
      - name: Check bilingual layout, English contacts and downloads
        run: python3 scripts/audit-bilingual.py
      - name: Verify browser-language routing and persisted visitor choice
        run: python3 scripts/audit-language.py
      - name: Attach QA screenshots and PDF samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-desktop-mobile-and-pdf-tests
          path: qa-output/
          if-no-files-found: warn
